name: Claude Code
version: "2.1.314"
slug: claude_code
description: >-
  Claude Code sempre ligado no Home Assistant, controlado de qualquer lugar
  pelo claude.ai/code ou pelo app do Claude (Remote Control). Modo controlado
  impede alteracoes nas configuracoes.
url: https://code.claude.com/docs
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto

# Remote Control so faz conexoes de saida (HTTPS); nenhuma porta e exposta.

# Montagens. Todas sao rw no Docker, mas no modo controlado o Claude roda como
# usuario sem privilegios (uid 1000) e os arquivos sao do root com permissao
# 644: ele le, mas nao grava. No modo livre roda como root e grava.
#   /homeassistant  -> configuracao do Home Assistant (/config no host)
#   /addon_configs  -> configuracoes de todos os add-ons
#   /share          -> pasta compartilhada
map:
  - homeassistant_config:rw
  - all_addon_configs:rw
  - share:rw

# Token do Supervisor (API do Core e do Supervisor e a CLI `ha`). So e
# entregue ao Claude no modo livre.
homeassistant_api: true
hassio_api: true
hassio_role: manager

# controlled_mode: ligado, o Claude so le as configuracoes (HA, add-ons,
#   /share) e nao recebe o token do Supervisor. Desligado, roda como root com
#   acesso total. Reinicie o add-on depois de mudar.
# permission_mode: modo de permissao das sessoes abertas pelo Remote Control.
#   `bypassPermissions` nao funciona no modo livre (o Claude recusa como root).
# session_name_prefix: prefixo dos nomes das sessoes no claude.ai/code.
options:
  controlled_mode: true
  permission_mode: default
  session_name_prefix: home-assistant
schema:
  controlled_mode: bool
  permission_mode: list(default|acceptEdits|auto|plan|dontAsk|bypassPermissions)
  session_name_prefix: match(^[A-Za-z0-9._-]+$)
